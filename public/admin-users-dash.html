<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>

    <script>
        let myModule = angular.module("moduleKuchBhi", []);
        let myController = myModule.controller("controllerKuchBhi", function ($scope, $http) {
            $scope.doShowAll = function () {
                let url = "/fetch-all";
                $http.get(url).then(function (resp) {
                    alert(JSON.stringify(resp.data))
                    $scope.jsonArray = resp.data;
                }, function (err) {
                    alert(err);
                });
            }
            //-------delete---------//
            $scope.doDelete = function (emailidKuch) {
                //let url="/do-delete?emailKeyKuch="+emailidKuch+"&pwdKuch="+pwdValue;
                alert(emailidKuch);
                let url = "/do-delete?emailKeyKuch=" + emailidKuch;
                $http.get(url).then(function (resp) {
                    alert(JSON.stringify(resp.data))
                    $scope.doShowAll();

                }, function (err) {
                    alert(err);
                });
            }
            //----------------block------------//

            $scope.doBlock = function (emailidKuch) {

                alert(emailidKuch);
                let url = "/do-Block?emailKeyKuch=" + emailidKuch;
                $http.get(url).then(function (resp) {
                    alert(JSON.stringify(resp.data))
                    $scope.doShowAll();

                }, function (err) {
                    alert(err);
                });
            }
            //---------------resume-----------//
            $scope.doResume = function (emailidKuch) {

                alert(emailidKuch);
                let url = "/do-Resume?emailKeyKuch=" + emailidKuch;
                $http.get(url).then(function (resp) {
                    alert(JSON.stringify(resp.data))
                    $scope.doShowAll();

                }, function (err) {
                    alert(err);
                });
            }

        });
    </script>

</head>

<body ng-app="moduleKuchBhi" ng-controller="controllerKuchBhi" ng-init="doShowAll();">
     <!-- nav bar -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm py-1">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="pics/logo1.jpeg" alt="Terviro" style="height:45px; width:auto; object-fit:contain;">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                </ul>

            </div>
        </div>
    </nav>
    <center>

        <!--    table hover=Highlights a row when you move the mouse over it.      align-middle
Vertically centers the content inside each cell. -->
        <table width="600" class="table table-hover table-bordered align-middle text-center shadow">
            <thead class="table-dark">
                <tr>
                    <th scope="col">Sr.NO</th>
                    <th scope="col">Email</th>
                    <th scope="col">Password</th>
                    <th scope="col">User type</th>
                    <th scope="col">Date of Submission</th>
                    <th scope="col">Status</th>
                    <th scope="col">Operation</th>
                     <th scope="col">Delete</th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="obj in jsonArray">
                    <td>{{$index+1}}</td>
                    <td>{{obj.emailid}}</td>
                    <td>{{obj.pwd}}</td>
                    <td>{{obj.utype}}</td>
                    <td>{{obj.dos | date:'dd-MMM-yyyy'}}</td>
                    <td>
                        <span class="badge bg-success" ng-if="obj.active==1">Active</span>
                        <span class="badge bg-danger" ng-if="obj.active==0">Blocked</span>
                    </td>

                    <td align="center">
                        <!-- <input type="button"  class="btn btn-outline-danger btn-sm" ng-click="doDelete(obj.emailid);" value="Delete"> -->

                        <a href="#" class="btn btn-outline-primary btn-sm" ng-click="doBlock(obj.emailid);">Block</a>
                        <a href="#" class="btn btn-outline-success" ng-click="doResume(obj.emailid);">Resume</a>
                    </td>
                    <td>
                        <a href="#" class="btn btn-outline-danger btn-sm" ng-click="doDelete(obj.emailid);">Delete</a>
                    </td>
                </tr>

            </tbody>
        </table>
    </center>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
