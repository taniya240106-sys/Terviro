<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    .card img {
      height: 220px;
      object-fit: contain;
      padding: 15px;
    }

    .bg-img {
      position: fixed;
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* instead of cover */
      z-index: -1;
    }
  </style>
  <script>
    function logout() {
      localStorage.removeItem("activeuser");
      location.href = "/";
    }
  </script>
</head>

<body style="background: linear-gradient(135deg,#eef6ff,#ffffff); min-height:100vh; background-attachment:fixed;">

  <!-- <img src="pics/ngo -bg.jpeg" class="bg-img"> -->


  <nav class="navbar navbar-expand-lg bg-white shadow-sm py-1">
    <div class="container-fluid px-4">
      <a class="navbar-brand d-flex align-items-center" href="#">
       <img src="pics/logo1.jpeg" alt="Terviro" style="height:45px; width:auto; object-fit:contain;"></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        </ul>
    <button class="btn btn-outline-danger" type="button" id="logout" onclick="logout()">
          <i class="bi bi-box-arrow-right"></i>LOGOUT</button>


      </div>
    </div>
  </nav>

  <div class="container text-center mt-1 mb-1">
    <h3 class="fw-bold">Empowering Communities with Terviro</h3>
    <p class="text-muted">
      🤝 Connecting resources with people who need them.
    </p>
</div>
  <!-- cards -->

  <div class="container mt-5">
    <div class="row justify-content-center g-5">
      <div class="col-md-4">
       <div class="card h-100 border-0 shadow-lg rounded-4">
          <img src="pics/ngo.jfif" class="card-img-top" alt="..." style="height:220px; object-fit:contain;">
          <div class="card-body text-center">
            <h4 class="card-title">NGO Profile</h4>
            <p class="text-muted">View your NGO profile .</p>
            <div class="text-center">
              <a href="/ngo-registration" class="btn btn-primary rounded-pill px-4">
                <i class="bi bi-person"></i>Manage Profile</a>
            </div>
          </div>
        </div>
      </div>
      <!--  -->

      <div class="col-md-4">
        <div class="card h-100 border-0 shadow-lg rounded-4">
          <img src="pics/images (1).png" class="card-img-top" alt="..." style="height:220px; object-fit:contain;">
          <div class="card-body text-center">
            <h4 class="card-title">Medicine</h4>
            <p class="text-muted">
              Find and manage medicines.
            </p>
            <div class="text-center">
              <a href="/medFinder" class=" btn btn-primary rounded-pill px-4">
                <i class="bi bi-search"></i>Find Medicine</a>
            </div>
          </div>
        </div>
      </div>
      <!--  -->
     <div class="col-md-4 ">
       <div class="card h-100 border-0 shadow-lg rounded-4">
          <img
            src="pics/FxROPe6dbLhkwWiQUmGZG3de9eSFT5GBbOfqdIZzNsUrNerMQWOTJJ-GasmnKLjGGLCWNdynQN0fIvu8efecBL-dnmQcsOEZmd8jNTZmVKFcFwOIaF6YoMSXDhube7prnpnWJ0zBaKgHzN8i5IB6fNbp1FmvIkAZR3MP1cqEjR4.jfif"
            class="card-img-top" alt="..." style="height:220px; object-fit:contain;">
          <div class="card-body text-center">
            <h4 class="card-title ">Equipment</h4>
            <p class="text-muted">Find and manage Equiment</p>
            <div class="text-center">
              <a href="/equipFinder" class=" btn btn-primary rounded-pill px-4">
                <i class="bi bi-box-seam"></i>Find Equipment</a>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
