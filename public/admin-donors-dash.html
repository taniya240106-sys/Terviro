<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>
  <script>

    let myModule = angular.module("mouduleKuch", []);
    let myController = myModule.controller("controllerKuch", function ($scope, $http) {
      $scope.doShowAll = function () {
        let url = "/fetch-alll";
        $http.get(url).then(function (resp) {
          alert(JSON.stringify(resp.data))
          $scope.jsonArray = resp.data;
        }, function (err) {
          alert(err);
        });
      }

    });
  </script>
</head>

<body ng-app="mouduleKuch" ng-controller="controllerKuch">
   <!-- nav bar -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm py-1">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="pics/logo1.jpeg" alt="Terviro" style="height:45px; width:auto; object-fit:contain;">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                </ul>

            </div>
        </div>
    </nav>
  <center>
    <input type="button" ng-click="doShowAll();" value="Fetch all Donors">
    <table width="600" class="table table-striped-columns w-75 mt-5 text-center" border="1">
      <thead class="table-dark">
        <tr>
          <th scope="col">Sr.NO</th>
          <th scope="col">Email Id</th>
          <th scope="col">Name</th>
          <th scope="col">Mobile</th>
          <th scope="col">Address</th>
          <th scope="col">City</th>
          <th scope="col">Aadhar Picture</th>
          <th scope="col">Profile Picture</th>
        </tr>
      </thead>
      <tbody>
        <tr ng-repeat="obj in jsonArray">
          <td>{{$index+1}}</td>
          <td>{{obj.emailid}}</td>
          <td>{{obj.name}}</td>
          <td>{{obj.mobile}}</td>
          <td>{{obj.address}}</td>
          <td>{{obj.city}}</td>
          <td>
            <center>
              <img ng-src={{obj.acardpath}} width="50" height="50" alt="">
            </center>
          </td>
           <td>
            <center>
              <img ng-src={{obj.picpath}}  class="img-thumbnail" width="50" height="50" alt="">
            </center>
          </td>
        </tr>

      </tbody>
    </table>
  </center>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
