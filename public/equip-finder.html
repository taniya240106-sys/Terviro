<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>

    <script>

        let myModule = angular.module("mouduleKuch", []);
        let myController = myModule.controller("controllerKuch", function ($scope, $http) {

            $scope.doShowCities = function () {

                let url = "/Show-Citiess";
                $http.get(url).then(function (resp) {
                    // alert(JSON.stringify(resp.data))
                    $scope.jsonAry = resp.data;
                }, function (err) {
                    alert(err);
                });
            }
            // -----------------------//
            $scope.doShowEquipByCity = function () {
                //   bcoz of ng-model="selCity"  $scope.selCity = "Noida";           
                let url = "/Show-EquipByCityy?city=" + $scope.selectedCity;
                $http.get(url).then(function (resp) {
                    //   alert($scope.selectedCity);
                    // alert(JSON.stringify(resp.data))
                    // server sends the filtered medicine list back to Angular. Angular stores it in jsonArrayMed
                    $scope.jsonArrayEquip = resp.data;
                }, function (err) {
                    alert(err);
                });

            }
            // ----------------//
            //-------------------------//
            // Fetch medicines based on selected city and medicine
            $scope.doShowSelEquip = function () {

                // Send selected city and medicine to serverlet url = "/Show-SelMed?medicine=" + $scope.selectedmedicine + "&city=" + $scope.selectedCity;
                let url = "/Show-SelEquipm?equipment=" + $scope.selectedequipment + "&city=" + $scope.selectedCity;
                $http.get(url).then(function (resp) {
                    // Store filtered medicines for card display
                    // alert($scope.selectedequipment);
                    // alert(JSON.stringify(resp.data))

                    $scope.jsonArrayEquipment = resp.data;
                }, function (err) {
                    alert(err);
                });

            }
            //---------shw donor-------//
            $scope.doShowDonor = function (Email) {

                let url = "/show-donors?email=" + Email;
                $http.get(url).then(function (resp) {
                    // alert(JSON.stringify(resp.data))
                    // Store donor details for modal
                    $scope.jsonArrayDonor = resp.data;
                }, function (err) {
                    alert(err);
                });
            }
        });
    </script>
</head>

<body ng-app="mouduleKuch" ng-controller="controllerKuch" ng-init="doShowCities(); "
    style="background:linear-gradient(135deg,#eef6ff); min-height:100vh;">
    <nav class="navbar navbar-expand-lg bg-white shadow-sm py-1">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="pics/logo1.jpeg" alt="Terviro" style="height:45px; width:auto; object-fit:contain;"> </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                </ul>

            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row  align-items-end">
            <!-- City Combo -->
            <div class="col-md-4">
                <label class="form-label fw-semibold">Select City</label>
                <!--  ng-model="selCity" stores selected  city which is select by user-->
                <!-- ng-change="doShowMedByCity()" automatically calls the doShowMedByCity() function. -->
                <select class="form-select" ng-model="selectedCity" ng-change="doShowEquipByCity()">
                    <option value="">Select City</option>
                    <option ng-repeat="obj in jsonAry" ng-value="obj.city">{{obj.city}}</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold">Choose Equipment</label>
                <input list="Equip-list" type="text" class="form-control" ng-model="selectedequipment"
                    placeholder="Type or select...">
                <datalist id="Equip-list">
                    <!-- ng-repeat fills the medicine datalist with only the medicines available in the selected city. -->
                    <option ng-repeat="obj in jsonArrayEquip" ng-value="obj.equipment"></option>
                </datalist>
            </div>
            <div class="col-md-4">
                <button type="button" class="btn btn-primary" ng-click="doShowSelEquip();">🔍 Find Equipment
                </button>
            </div>
        </div>
    </div>
    <!-- cards -->
    <div class="container">
        <div class="row g-3 mt-4">
            <div class="col-md-3" ng-repeat="obj in jsonArrayEquipment">
                <div class="card border text-center shadow card shadow rounded-4 h-100">

                    <img src="{{obj.pic1url}}" height="100" class="card-img-top" style="height:180px; object-fit:cover;"
                        alt="...">
                    <div class="card-body">
                        <h5 class="card-title"> {{obj.equipment}}</h5>
                        <p class="card-text">
                            📧: {{obj.emailid}}
                        </p>

                        <p class="card-text">
                            Conditions📦: {{obj.conditions}}
                        </p>
                        <a href="#" ng-click="doShowDonor(obj.emailid)" data-bs-toggle="modal"
                            data-bs-target="#donorModal" class="btn btn-outline-primary">👤 See Donor
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DONOR -->
    <div class="modal fade" id="donorModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header" style="background-color: azure;">
                    <h1 class="modal-title fs-5" id="donortable">Donor's Details</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row align-items-center">

                        <table width="600" class="table table-striped-columns w-75 mt-5" border="1">
                            <thead>
                                <tr>

                                    <th scope="col">Sr.No</th>
                                    <th scope="col">EmailId</th>
                                    <th scope="col">Name</th>
                                    <th scope="col">Mobile</th>
                                    <th scope="col">Address </th>
                                    <th scope="col">City </th>
                                    <th scope="col">Aadhar Picture </th>
                                    <th scope="col">Profile Picture </th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr ng-repeat="obj in jsonArrayDonor">
                                    <th>{{$index+1}}</th>
                                    <td>{{obj.emailid}}</td>
                                    <td>{{obj.name}}</td>
                                    <td>{{obj.mobile}}</td>
                                    <td>{{obj.address}}</td>
                                    <td>{{obj.city}}</td>
                                    <td>
                                        <center>
                                            <img src="{{obj.acardpath}}" width="50" height="50" alt="">
                                        </center>
                                    </td>
                                    <td>
                                        <center>
                                            <img src="{{obj.picpath}}" width="50" height="50" alt="">
                                        </center>
                                    </td>


                                </tr>


                            </tbody>
                        </table>
                        <!-- <p>
                            <center>
                                <img src="{{obj.acardpath}}" width="50" height="50" alt="">
                            </center>
                        </p> 
                        < <div class="col-md-4 text-center">
                            <img src="{{obj.picpath}}" class="img-fluid rounded-circle border shadow" width="180px" height="180px" object-fit:cover;>

                            <h3 class="fw-bold mt-3">{{obj.name}}</h3>
                        </div>
                        Details
                        <div class="col-md-8">

                            <p>Email : {{obj.emailid}}</p>
                            <p>Mobile : {{obj.mobile}}</p>
                            <p>Address : {{obj.address}}</p>
                            <p>City : {{obj.city}}</p>

                         <hr>

                            <h6>Aadhar Card</h6>
                            <img src="{{obj.acardpath}}" class="img-thumbnail" width="250"> 

                        </div>

                    </div> -->

                    </div>

                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
</body>

</html>
